name: Hent kurshistorik

# Henter historik til graferne og lægger den på grenen "data".
on:
  schedule:
    - cron: "*/15 13-21 * * 1-5"   # hvert kvarter i USA's åbningstid (UTC), man-fre
    - cron: "30 22 * * 1-5"        # én gang efter lukketid
  push:
    branches: [main]
    paths: ["config.js", "scripts/**", ".github/workflows/**"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: historik
  cancel-in-progress: true

jobs:
  hent:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Hent historik
        run: node scripts/hent-historik.mjs out "https://raw.githubusercontent.com/${{ github.repository }}/data/"
      - name: Gem på grenen data
        run: |
          cd out
          git init -q -b data
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Kurshistorik $(date -u +%FT%TZ)"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" data
